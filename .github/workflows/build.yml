name: Build OpenWrt Packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build apk packages (OpenWrt 25.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison python3 python3-setuptools \
            libncurses5-dev zlib1g-dev gawk gcc-multilib \
            libssl-dev elfutils libelf-dev rsync unzip wget \
            file quilt help2man lua5.1 xz-utils zstd

      - name: Download OpenWrt Snapshot SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading OpenWrt snapshot SDK..."
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst

      - name: Prepare SDK
        run: |
          cd sdk
          make defconfig

      - name: Copy packages to SDK
        run: |
          cp -r campus-portal-auth sdk/package/campus-portal-auth
          cp -r luci-app-campus-portal-auth sdk/package/luci-app-campus-portal-auth

      - name: Build campus-portal-auth
        run: |
          cd sdk
          make package/campus-portal-auth/compile V=s -j$(nproc) || \
          make package/campus-portal-auth/compile V=s -j1

      - name: Build luci-app-campus-portal-auth
        run: |
          cd sdk
          make package/luci-app-campus-portal-auth/compile V=s -j$(nproc) || \
          make package/luci-app-campus-portal-auth/compile V=s -j1

      - name: Collect packages
        run: |
          mkdir -p output
          find sdk/bin/packages -name '*.apk' -exec cp {} output/ \; 2>/dev/null || true
          find sdk/bin/packages -name '*.ipk' -exec cp {} output/ \; 2>/dev/null || true
          find sdk/build_dir -name '*.apk' -exec cp {} output/ \; 2>/dev/null || true
          find sdk/build_dir -name '*.ipk' -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Built packages ==="
          ls -lh output/ || echo "No packages found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h3c-campus-auth-packages
          path: output/*
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
